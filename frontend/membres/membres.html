<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AgriCoop Connect — Membres</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <link rel="stylesheet" href="membres.css" />
    </head>
    <body>
        <div class="container">
            <aside class="sidebar" id="sidebar">
                <div class="logo">
                    <img
                        src="../assets/logo.png"
                        alt="Logo Agricoop"
                        width="150px"
                    />
                </div>

                <nav class="menu">
                    <a href="../dashboard/dashboard.html" class="menu-lien">
                        <i class="fas fa-chart-line"></i>
                        <span>Tableau de bord</span>
                    </a>
                    <a href="../membres/membres.html" class="menu-lien active">
                        <i class="fas fa-users"></i>
                        <span>Membres</span>
                    </a>
                    <a href="../livraisons/livraisons.html" class="menu-lien">
                        <i class="fas fa-truck"></i>
                        <span>Livraisons</span>
                    </a>
                    <a href="../paiements/paiements.html" class="menu-lien">
                        <i class="fas fa-money-bill-wave"></i>
                        <span>Paiements</span>
                    </a>
                    <a href="../ventes/ventes.html" class="menu-lien">
                        <i class="fas fa-hand-holding-dollar"></i>
                        <span>Ventes</span>
                    </a>
                    <a
                        href="../statistiques/statistiques.html"
                        class="menu-lien"
                    >
                        <i class="fas fa-chart-bar"></i>
                        <span>Statistiques</span>
                    </a>
                    <a href="../comptes/comptes.html" class="menu-lien">
                        <i class="fas fa-user-shield"></i>
                        <span>Comptes</span>
                    </a>

                    <!-- MODIFICATION ICI : Ajout de l'ID btn-deconnexion -->
                    <a
                        href="#"
                        id="btn-deconnexion"
                        class="menu-lien menu-deco"
                    >
                        <i class="fas fa-power-off"></i>
                        <span>Déconnexion</span>
                    </a>
                </nav>
            </aside>
            <main>
                <header class="header">
                    <img
                        src="../assets/logo__fond_blanc.png"
                        alt="Logo Agricoop"
                        width="150px"
                        class="logo"
                    />

                    <div class="profil">
                        <div class="icon">
                            <i
                                class="fa-regular fa-bell"
                                style="color: #00331b"
                            ></i>
                        </div>

                        <div class="profil_detail">
                            <!-- MODIFICATION ICI : Utilisation de l'ID utilisateur-connecte -->
                            <span id="utilisateur-connecte">Chargement...</span>
                            <span class="profil_role" id="role_utilisateur"
                                >Utilisateur</span
                            >
                        </div>

                        <div class="profil_box_picture">
                            <img
                                src="../assets/sarah_malonga.png"
                                alt="Photo de profil"
                                width="150px"
                            />
                        </div>
                    </div>
                </header>
                <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         Construire une zone de filtrage : un sélecteur de statut et un champ
         de recherche par nom. Layout responsive.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
                <div class="main">
                    <h1>MEMBRES</h1>
                    <form id="form-nouveau-membre">
                        <h3>Nouveau Membre</h3>
                        <label for="last_name">Nom</label>
                        <input
                            type="text"
                            id="nm-prenom"
                            class="for_b"
                            placeholder="Prénom"
                        />
                        <label for="name"> Prénom</label>
                        <input
                            type="text"
                            id="nm-nom"
                            class="for"
                            placeholder="Nom"
                        />
                        <label for="Village">Village</label>
                        <select id="nm-village" class="for">
                            <option value="">-- Choisir un village --</option>
                        </select>
                        <label for="telephone">Téléphone</label>
                        <input
                            type="text"
                            id="nm-contact"
                            placeholder="Contact (téléphone)"
                            class="for_b"
                        />
                        <button type="submit" class="btn_sub">
                            Créer le membre
                        </button>
                    </form>

                    <div id="erreurs-nouveau-membre" hidden></div>
                    <div id="message-succes-nouveau-membre" hidden></div>

                    <h4>Filtre par statut</h4>
                    <select id="filtre-statut">
                        <option value="">Tous</option>
                        <option value="À jour">À jour</option>
                        <option value="En retard">En retard</option>
                    </select>

                    <input
                        type="text"
                        id="champ-recherche-membre"
                        placeholder="Rechercher un membre..."
                    />

                    <!-- =====================================================================
         LISTE DES MEMBRES — TODO (Dev FS2)
         Le contenu est injecté par main.js. Le dev doit structurer le
         conteneur et styliser les éléments .membre-ligne, .badge.

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
                    <div id="liste-membres"></div>

                    <!-- =====================================================================
         NOUVEAU MEMBRE — TODO (Dev FS2)
         Construire le formulaire de création d'un membre (module Membres,
         nouveau — section 4.1 du FRD). Les 4 champs sont obligatoires.
         Le village est un menu déroulant fermé (rempli par main.js depuis
         la liste de référence de la coopérative), pas un champ libre.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
                </div>
            </main>
        </div>

        <!-- NE PAS MODIFIER — scripts de connexion au backend -->
        <script src="../functions.js"></script>
        <script src="../main.js"></script>
    </body>
</html>
