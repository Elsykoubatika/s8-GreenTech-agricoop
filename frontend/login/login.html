<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AgriCoop Connect — Connexion</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />

        <link rel="stylesheet" href="login.css" />
    </head>
    <body>
        <main class="login-page">
            <div class="left">
                <div class="left-logo">
                    <img src="../assets/logo.png" alt="" width="300px" />
                </div>

                <div class="left-content">
                    <div class="left-content-text">
                        <h1>Connexion</h1>
                        <p>
                            Connectez-vous à votre compte pour accéder à votre
                            espace
                        </p>
                    </div>

                    <div class="left-image"></div>
                </div>
            </div>

            <div class="right">
                <div class="login-box">
                    <form id="form-login">
                        <div class="login-header">
                            <div class="avatar">
                                <i class="fas fa-user"></i>
                            </div>

                            <h2>Bienvenue !</h2>
                            <p>Veuillez saisir vos identifiants</p>
                        </div>

                        <div>
                            <label for="l-nom-utilisateur"
                                >Nom d'utilisateur</label
                            >

                            <input
                                type="text"
                                id="l-nom-utilisateur"
                                placeholder="Entrez votre nom d'utilisateur"
                            />
                        </div>

                        <div>
                            <label for="l-mot-de-passe">Mot de passe</label>

                            <div class="password-field">
                                <input
                                    type="password"
                                    id="l-mot-de-passe"
                                    placeholder="Entrez votre mot de passe"
                                />
                            </div>
                        </div>

                        <div class="login-options">
                            <label class="remember-me">
                                <input type="checkbox" />
                                <span>Se souvenir de moi</span>
                            </label>

                            <a href="#">Mot de passe oublié ?</a>
                        </div>

                        <button type="submit">Se connecter</button>

                        <p class="login-footer">
                            Comptes créés uniquement par la Secrétaire.
                        </p>
                    </form>

                    <div id="message-erreur-login" hidden></div>
                </div>
            </div>
        </main>
        <!-- NE PAS MODIFIER — scripts de connexion au backend -->
        <script src="../functions.js"></script>
        <script src="../main.js"></script>
    </body>
</html>
