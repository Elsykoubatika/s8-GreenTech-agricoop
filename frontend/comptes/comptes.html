<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AgriCoop Connect — Gestion des comptes</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <link rel="stylesheet" href="comptes.css" />
    </head>
    <body>
        <div class="container">
            <aside class="sidebar" id="sidebar">
                <div class="logo">
                    <img
                        src="../assets/logo.png"
                        alt="Logo Agricoop"
                        width="150px"
                    />
                </div>

                <nav class="menu">
                    <a href="../dashboard/dashboard.html" class="menu-lien">
                        <i class="fas fa-chart-line"></i>
                        <span>Tableau de bord</span>
                    </a>
                    <a href="../membres/membres.html" class="menu-lien">
                        <i class="fas fa-users"></i>
                        <span>Membres</span>
                    </a>
                    <a href="../livraisons/livraisons.html" class="menu-lien">
                        <i class="fas fa-truck"></i>
                        <span>Livraisons</span>
                    </a>
                    <a href="../paiements/paiements.html" class="menu-lien">
                        <i class="fas fa-money-bill-wave"></i>
                        <span>Paiements</span>
                    </a>
                    <a href="../ventes/ventes.html" class="menu-lien">
                        <i class="fas fa-hand-holding-dollar"></i>
                        <span>Ventes</span>
                    </a>
                    <a
                        href="../statistiques/statistiques.html"
                        class="menu-lien"
                    >
                        <i class="fas fa-chart-bar"></i>
                        <span>Statistiques</span>
                    </a>
                    <a href="../comptes/comptes.html" class="menu-lien active">
                        <i class="fas fa-user-shield"></i>
                        <span>Comptes</span>
                    </a>

                    <a
                        href="#"
                        id="btn-deconnexion"
                        class="menu-lien menu-deco"
                    >
                        <i class="fas fa-power-off"></i>
                        <span>Déconnexion</span>
                    </a>
                </nav>
            </aside>
            <main>
                <header class="header">
                    <img
                        src="../assets/logo__fond_blanc.png"
                        alt="Logo Agricoop"
                        width="150px"
                        class="logo"
                    />

                    <div class="profil">
                        <div class="icon">
                            <i
                                class="fa-regular fa-bell"
                                style="color: #00331b"
                            ></i>
                        </div>

                        <div class="profil_detail">
                            <span id="utilisateur-connecte">Chargement...</span>
                            <span class="profil_role" id="role_utilisateur"
                                >Utilisateur</span
                            >
                        </div>

                        <div class="profil_box_picture">
                            <img
                                src="../assets/sarah_malonga.png"
                                alt="Photo de profil"
                                width="150px"
                            />
                        </div>
                    </div>
                </header>
                <div class="main">

                    <h1>Comptes</h1>
                    <!-- =====================================================================
         RÉSERVÉ À LA SECRÉTAIRE — TODO (Dev FS2)
         Cette page ne devrait être utile qu'à la Secrétaire (rôle Admin).
         Afficher un avertissement si l'utilisateur connecté n'a pas ce
         rôle (voir main.js : la variable de session est lue depuis le
         stockage local du navigateur, clé "agricoop_utilisateur").

         *** NE PAS MODIFIER l'id ci-dessous ***
         ===================================================================== -->
                    <div id="acces-refuse-comptes" hidden>
                        <p>
                            Vous n'avez pas l'autorisation d'accéder à cette
                            page.
                        </p>
                    </div>

                    <!-- =====================================================================
         FORMULAIRE NOUVEAU COMPTE — TODO (Dev FS2)
         Construire le formulaire de création de compte (nom d'utilisateur,
         mot de passe, rôle, nom complet). Le rôle est un menu déroulant à
         choix fermé (Président / Trésorière / Responsable dépôt / Membre —
         la Secrétaire ne recrée pas d'autre Secrétaire depuis cet écran).

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
                    <form id="form-nouveau-compte">
                        <input
                            type="text"
                            id="c-nom-utilisateur"
                            placeholder="Nom d'utilisateur"
                        />
                        <input
                            type="password"
                            id="c-mot-de-passe"
                            placeholder="Mot de passe temporaire"
                        />
                        <input
                            type="text"
                            id="c-nom-complet"
                            placeholder="Nom complet"
                        />
                        <select id="c-role">
                            <option value="">-- Choisir un rôle --</option>
                            <option value="Président">Président</option>
                            <option value="Trésorière">Trésorière</option>
                            <option value="Responsable dépôt">
                                Responsable dépôt
                            </option>
                            <option value="Membre">Membre</option>
                        </select>
                        <button type="submit">Créer le compte</button>
                    </form>

                    <div id="message-erreur-compte" hidden></div>
                    <div id="message-succes-compte" hidden></div>

                    <!-- =====================================================================
         LISTE DES COMPTES EXISTANTS — TODO (Dev FS2)
         Construire un tableau. Le contenu des <tr> est injecté par main.js.

         *** NE PAS MODIFIER l'id ci-dessous ***
         ===================================================================== -->
                    <div class="table-card">
                        <h4>Liste des comptes</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>Nom d'utilisateur</th>
                                    <th>Nom complet</th>
                                    <th>Rôle</th>
                                </tr>
                            </thead>
                            <tbody id="liste-comptes"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>

        <!-- NE PAS MODIFIER — scripts de connexion au backend -->
        <script src="../functions.js"></script>
        <script src="../main.js"></script>
    </body>
</html>
