        />
        <link

        <link rel="stylesheet" href="livraisons.css" />
    </head>
    <body>
        <div class="container">

                <div class="logo">

                <nav class="menu">

                    </a>
                    <a href="../membres/membres.html" class="menu-lien">
                        <i class="fas fa-users"></i>
                        <span>Membres</span>
                    </a>
                    <a
                        href="../livraisons/livraisons.html"
                        class="menu-lien active"
                    >
                        <i class="fas fa-truck"></i>
                        <span>Livraisons</span>
                    </a>
                    <a href="../paiements/paiements.html" class="menu-lien">
                        <i class="fas fa-money-bill-wave"></i>
                        <span>Paiements</span>
                    </a>
                    <a href="../ventes/ventes.html" class="menu-lien">
                        <i class="fas fa-hand-holding-dollar"></i>
                        <span>Ventes</span>

                    <a

                        class="menu-lien"
                    >

                    <a href="../comptes/comptes.html" class="menu-lien">

                    <a
                        href="#"
                        id="btn-deconnexion"

                    >
                        <i class="fas fa-power-off"></i>
                        <span>Déconnexion</span>
                    </a>
                </nav>
            </aside>

            <main>
                <header class="header">
                    <img
                        src="../assets/logo__fond_blanc.png"
                        alt="Logo Agricoop"
                        width="150px"
                        class="logo"
                    />

                    <div class="profil">
                        <div class="icon">
                            <i
                                class="fa-regular fa-bell"
                                style="color: #00331b"
                            ></i>
                        </div>

                        <div class="profil_detail">
                            <span id="utilisateur-connecte">Chargement...</span>
                            <span class="profil_role" id="role_utilisateur"
                                >Utilisateur</span
                            >
                        </div>

                        <div class="profil_box_picture">
                            <img
                                src="../assets/sarah_malonga.png"
                                alt="Photo de profil"
                                width="150px"
                            />
                        </div>
                    </div>
                </header>

                <div class="livraison-container">
                    <h1>Livraisons</h1>
                    <!-- =====================================================================
                        FORMULAIRE D'ENREGISTREMENT — TODO (Dev FS3)
                        Construire le formulaire (membre, culture, quantité) et les zones
                        de messages. Le dev doit structurer et styliser le formulaire.

                        *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
                    ===================================================================== -->
                    <form id="form-livraison" class="formulaire">
                        <div class="field">
                            <label for="f-membre">Membre</label>
                            <select id="f-membre">
                                <option value="">
                                    -- Choisir un membre --
                                </option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="f-culture">Culture</label>
                            <select id="f-culture">
                                <option value="">
                                    -- Choisir une culture --
                                </option>
                                <option value="Manioc">Manioc</option>
                                <option value="Maïs">Maïs</option>
                                <option value="Arachide">Arachide</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="f-quantite">Quantité (kg)</label>
                            <input
                                type="number"
                                id="f-quantite"
                                min="1"
                                placeholder="Quantité (kg)"
                            />
                        </div>
                        <button type="submit">Enregistrer</button>
                    </form>

                    <div id="message-erreur-livraison" hidden></div>
                    <div id="message-succes-livraison" hidden></div>

                    <!-- =====================================================================
                        TABLEAU DES LIVRAISONS — TODO (Dev FS3)
                        Construire un tableau HTML triable. Le contenu des <tr> est injecté
                        par main.js dans le <tbody>. Le dev structure le <table>, le <thead>,
                        et le bouton de tri.

                        *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
                    ===================================================================== -->
                    <button id="btn-trier-livraisons">Trier par date</button>

                    <table>
                        <thead>
                            <tr>
                                <th>Membre</th>
                                <th>Culture</th>
                                <th>Quantité (kg)</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="liste-livraisons"></tbody>
                    </table>
                </div>
            </main>
        </div>

        <script src="../functions.js"></script>
        <script src="../main.js"></script>
        <script>
            async function remplirSelectMembres() {
                const selectMembre = document.getElementById('f-membre');
                if (!selectMembre) return;

                try {
                    // On appelle l'API pour récupérer les membres
                    const reponse = await fetch(
                        'http://localhost:5000/api/membres',
                    );
                    const data = await reponse.json();

                    if (reponse.ok && data.membres) {
                        // On vide l'option par défaut
                        selectMembre.innerHTML =
                            '<option value="">-- Choisir un membre --</option>';

                        // On ajoute chaque membre dans le select
                        data.membres.forEach((membre) => {
                            const option = document.createElement('option');
                            // main.js utilise Number(...) sur cette valeur, il faut donc l'ID
                            option.value = membre.id || membre._id;
                            option.textContent = membre.nom;
                            selectMembre.appendChild(option);
                        });
                    }
                } catch (e) {
                    console.error(
                        'Impossible de charger les membres pour le formulaire :',
                        e,
                    );
                }
            }

            // On lance la fonction quand la page est prête
            document.addEventListener('DOMContentLoaded', remplirSelectMembres);
        </script>
    </body>
</html>
