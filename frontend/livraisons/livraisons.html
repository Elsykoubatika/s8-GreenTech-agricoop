         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <form id="form-livraison">
      <select id="f-membre"><option value="">-- Choisir un membre --</option></select>
      <select id="f-culture">
        <option value="">-- Choisir une culture --</option>
        <option value="Manioc">Manioc</option>
        <option value="Maïs">Maïs</option>
        <option value="Arachide">Arachide</option>
      </select>
      <input type="number" id="f-quantite" min="1" placeholder="Quantité (kg)">
      <button type="submit" class="rec">Enregistrer</button>
    </form>

    <div id="message-erreur-livraison" hidden></div>
    <div id="message-succes-livraison" hidden></div>
